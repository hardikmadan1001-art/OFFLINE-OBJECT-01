<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101c2d">
  <title>OBJECT 01 · OFFLINE®</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <script src="/palettes.js"></script>
</head>
<body>
  <main class="campaign">
    <section class="studio" aria-label="OBJECT 01 film">
      <picture class="canopy" aria-hidden="true">
        <source media="(max-aspect-ratio: 9/10)" srcset="/assets/finale/canopy-portrait.webp">
        <img src="/assets/finale/canopy-wide.webp" alt="" fetchpriority="high">
      </picture>
      <picture class="still" aria-hidden="true"><img alt=""></picture>
      <canvas id="studio-film" aria-hidden="true"></canvas>
      <div class="exposure" aria-hidden="true"></div>
      <a class="wordmark" href="#signature">OFFLINE<sup>®</sup></a>
      <button class="restart" type="button" aria-label="Replay film">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 8a6.1 6.1 0 1 1 .8 6M4 4v4h4" stroke="currentColor" stroke-width="1.35"/></svg>
      </button>
      <div class="campaign-title">
        <h1>Quiet,<br> by design.</h1>
        <a class="discover" href="#object">Discover Object 01 <span aria-hidden="true">↓</span></a>
      </div>
    </section>

    <section class="product-section" id="object" aria-labelledby="object-title">
      <div class="product-rectangle">
        <div class="product-view">
          <img class="product-still" src="/assets/finale/player-still.webp" alt="The OFFLINE portable audio player" width="640" height="800" decoding="async">
          <canvas id="product-player" aria-label="3D product viewer. Drag to rotate, or use the arrow keys."></canvas>
        </div>
        <div class="product-copy">
          <div class="product-kicker">Portable audio</div>
          <h2 id="object-title">Object 01</h2>
          <div class="material-label"><span>Finish</span><output class="finish-name"></output></div>
          <div class="finishes" role="group" aria-label="Player finish"></div>
          <div class="demo-actions">
            <button type="button" data-radio aria-pressed="false">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="m4 2.5 7 4.5-7 4.5z" stroke="currentColor" stroke-linejoin="round"/></svg>
              <span>Listen</span>
            </button>
            <button type="button" data-explode aria-pressed="false">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m8 2-6 3 6 3 6-3-6-3ZM2 8l6 3 6-3M2 11l6 3 6-3" stroke="currentColor" stroke-linejoin="round"/></svg>
              <span>See inside</span>
            </button>
          </div>
          <button class="order" type="button" data-order>Reserve Object 01 <span aria-hidden="true">↗</span></button>
        </div>
      </div>
    </section>

    <footer class="signature" id="signature" aria-label="OFFLINE signature">
      <div class="signature-bar"><a href="/credits.html" target="_top">Credits</a></div>
      <div class="signature-word"><img src="/assets/finale/signature.webp" alt="OFFLINE, spelled with machined audio keys" width="1850" height="545" loading="lazy"></div>
    </footer>
  </main>
  <dialog aria-labelledby="reserve-title">
    <button class="close" type="button" aria-label="Close">×</button>
    <p class="product-kicker">Reservation demo</p>
    <h2 id="reserve-title">Object 01</h2>
    <div class="reservation-line"><span>Finish</span><output class="reserve-finish"></output></div>
    <label class="reservation-line">Quantity <input type="number" min="1" max="9" value="1"></label>
    <button class="order" type="button" data-confirm>Confirm reservation <span aria-hidden="true">↗</span></button>
    <p class="confirmation" role="status">No payment is taken.</p>
  </dialog>
  <script type="module" src="/src/object.ts"></script>
</body>
</html>
